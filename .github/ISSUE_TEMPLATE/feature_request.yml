name: ✨ Feature request
description: Propose a new capability or an improvement.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Behaviour, interfaces (topics, parameters, APIs) and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: control
    attributes:
      label: Control / estimation design (if applicable)
      description: >
        For anything that drives an actuator or estimates physical state: plant model, sensors and
        noise, filter, estimator, controller and why it fits, sample time, and the reference you
        base it on.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
