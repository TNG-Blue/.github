name: 🐛 Bug report
description: Something does not work as documented.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Actual behaviour versus expected behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ros2 launch ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.4.0 or a1b2c3d
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Jetson Orin Nano Super
        - Jetson (other)
        - x86_64 + NVIDIA GPU
        - STM32 / microcontroller
        - Simulation (Gazebo / MATLAB)
        - Other
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: JetPack, ROS 2 distro, CUDA/TensorRT, firmware version, OS.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant output; it is rendered as code.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This bug can move hardware unexpectedly (uncommanded actuation, failsafe not triggered).
